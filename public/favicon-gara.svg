<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cronometro di gara">
  <!-- Sfondo pieno: le icone maskable vengono ritagliate a cerchio da Android,
       quindi il contenuto sta dentro la "safe zone" centrale (raggio ~205). -->
  <rect width="512" height="512" fill="#060f1e"/>
  <!-- corona e pulsante superiore del cronometro -->
  <rect x="226" y="74" width="60" height="34" rx="12" fill="#1aa05e"/>
  <rect x="246" y="52" width="20" height="30" rx="8" fill="#1aa05e"/>
  <!-- quadrante -->
  <circle cx="256" cy="292" r="150" fill="none" stroke="#1aa05e" stroke-width="26"/>
  <circle cx="256" cy="292" r="150" fill="#0d1b2a"/>
  <!-- tacche dei quarti -->
  <g stroke="#3b5a9d" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="168" x2="256" y2="190"/>
    <line x1="380" y1="292" x2="358" y2="292"/>
    <line x1="256" y1="416" x2="256" y2="394"/>
    <line x1="132" y1="292" x2="154" y2="292"/>
  </g>
  <!-- lancetta -->
  <line x1="256" y1="292" x2="330" y2="218" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="292" r="17" fill="#1aa05e"/>
</svg>
