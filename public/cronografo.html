<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronografo Circuiti</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root {
    --bg: #060f1e;
    --card: #0d1b2a;
    --accent: #1aa05e;
    --accent-light: #4ade80;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --border: #1e3a52;
    --danger: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .cr-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 14px 20px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .cr-back:hover { color: var(--accent-light); }
  .cr-header {
    padding: 0 20px 10px;
  }
  .cr-header h1 {
    font-size: 1.4rem;
    margin: 0;
    color: var(--accent-light);
  }
  .cr-header p {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin: 4px 0 0;
  }
  .cr-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 16px 60px;
  }
  .cr-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .cr-card h2 {
    font-size: 1rem;
    margin: 0 0 14px;
    color: var(--text);
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    background: #0a1622;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .cr-display {
    text-align: center;
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent-light);
    padding: 20px 0;
    letter-spacing: 1px;
  }
  .cr-btns {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }
  .cr-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .cr-btn-start { background: var(--accent); color: #04140b; }
  .cr-btn-lap { background: #1e3a52; color: var(--text); }
  .cr-btn-stop { background: var(--danger); color: #fff; }
  .cr-btn-reset { background: #1e3a52; color: var(--text-dim); }
  .cr-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cr-laps {
    margin-top: 12px;
    max-height: 160px;
    overflow-y: auto;
  }
  .cr-lap-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .cr-assign {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    margin-top: 14px;
  }
  .cr-assign select { margin-bottom: 0; }
  .cr-assign button {
    background: var(--accent);
    color: #04140b;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .cr-assign button:disabled { opacity: 0.4; cursor: not-allowed; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.8rem; }
  td.num { font-variant-numeric: tabular-nums; }
  .cr-icon-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 6px;
  }
  .cr-icon-btn:hover { color: var(--accent-light); }
  .cr-save-btn {
    width: 100%;
    background: var(--accent);
    color: #04140b;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
  }
  .cr-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cr-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 999;
    display: none;
  }
  .cr-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .cr-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0a1622;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .cr-tab.active {
    background: var(--accent);
    color: #04140b;
    border-color: var(--accent);
    font-weight: 600;
  }
  .cr-delta-up { color: #ef4444; }
  .cr-delta-down { color: #4ade80; }
  .cr-empty {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 20px 0;
  }
  .cr-group-search {
    margin-bottom: 10px;
  }
  .cr-group-list {
    max-height: 280px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .cr-group-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .cr-group-row:last-child { border-bottom: none; }
  .cr-group-row.has-laps { background: rgba(74, 222, 128, 0.08); }
  .cr-group-row.disabled-row {
    pointer-events: none;
    opacity: 0.5;
    cursor: default;
  }
  .cr-group-row .cr-group-name { font-weight: 600; }
  .cr-group-row .cr-group-meta { color: var(--text-dim); font-size: 0.8rem; }
</style>
</head>
<body>
<a href="/area-tecnica.html" class="cr-back">← Area Tecnica</a>
<div class="cr-header">
  <h1>⏱️ Cronografo Circuiti</h1>
  <p>Cronometra un circuito e assegna il tempo agli atleti, con frazionamenti.</p>
</div>
<div class="cr-container">

  <div class="cr-card">
    <h2>Cronometro</h2>
    <div class="cr-tabs">
      <div class="cr-tab active" id="cr-mode-individuale" data-mode="individuale">Individuale</div>
      <div class="cr-tab" id="cr-mode-gruppo" data-mode="gruppo">Gruppo</div>
    </div>
    <label for="cr-circuito">Nome circuito</label>
    <input type="text" id="cr-circuito" list="cr-circuiti-list" placeholder="Es. Slalom 20m">
    <datalist id="cr-circuiti-list"></datalist>

    <div class="cr-display" id="cr-display">00:00.00</div>

    <div class="cr-btns">
      <button class="cr-btn cr-btn-start" id="cr-btn-start">▶ Start</button>
      <button class="cr-btn cr-btn-lap" id="cr-btn-lap" disabled>🏁 Lap</button>
      <button class="cr-btn cr-btn-stop" id="cr-btn-stop" disabled>⏹ Stop</button>
      <button class="cr-btn cr-btn-reset" id="cr-btn-reset" disabled>↺ Reset</button>
    </div>

    <div class="cr-laps" id="cr-laps"></div>

    <div id="cr-panel-individuale">
      <div class="cr-assign">
        <div style="flex:1;">
          <label for="cr-atleta">Assegna a</label>
          <select id="cr-atleta" disabled></select>
        </div>
        <button id="cr-btn-assign" disabled>+ Aggiungi alla lista</button>
      </div>
    </div>

    <div id="cr-panel-gruppo" style="display:none;">
      <input type="text" id="cr-group-search" class="cr-group-search" placeholder="Cerca atleta…" aria-label="Cerca atleta">
      <div class="cr-group-list" id="cr-group-list"></div>
    </div>
  </div>

  <div class="cr-card" id="cr-session-card" style="display:none;">
    <h2>Sessione corrente</h2>
    <table>
      <thead><tr><th>Atleta</th><th>Tempo</th><th></th></tr></thead>
      <tbody id="cr-session-body"></tbody>
    </table>
    <button class="cr-save-btn" id="cr-btn-save">💾 Salva tutti i tempi (0)</button>
  </div>

  <div class="cr-card">
    <h2>Storico</h2>
    <div class="cr-tabs">
      <div class="cr-tab active" id="cr-tab-atleta" data-tab="atleta">Per atleta</div>
      <div class="cr-tab" id="cr-tab-squadra" data-tab="squadra">Confronto squadra</div>
    </div>
    <div id="cr-view-atleta">
      <label for="cr-storico-atleta">Atleta</label>
      <select id="cr-storico-atleta"></select>
      <label for="cr-storico-circuito">Circuito</label>
      <select id="cr-storico-circuito"></select>
      <div id="cr-storico-atleta-content"></div>
    </div>
    <div id="cr-view-squadra" style="display:none;">
      <label for="cr-squadra-circuito">Circuito</label>
      <select id="cr-squadra-circuito"></select>
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label for="cr-squadra-data-a">Data A</label>
          <select id="cr-squadra-data-a"></select>
        </div>
        <div style="flex:1;">
          <label for="cr-squadra-data-b">Data B</label>
          <select id="cr-squadra-data-b"></select>
        </div>
      </div>
      <div id="cr-squadra-content"></div>
    </div>
  </div>

</div>
<div class="cr-toast" id="cr-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Autenticazione/annata (pattern da area-tecnica.js) ─────────────────────
function ss(key) {
  return sessionStorage.getItem(key) || localStorage.getItem('_p_' + key) || '';
}
function annataId() {
  const u = new URL(location.href);
  return u.searchParams.get('annata') || ss('gosport_current_annata') || localStorage.getItem('currentAnnata') || '';
}
function authHeaders(json) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  h['X-Annata-Id'] = annataId();
  h['X-Auth-Session'] = ss('gosport_session_token') || ss('gosport_auth_session') || '';
  h['X-Auth-User'] = ss('gosport_auth_user');
  h['X-User-Role'] = ss('gosport_user_role');
  h['X-Society-Id'] = ss('gosport_society_id');
  return h;
}
function toast(msg) {
  const t = document.getElementById('cr-toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, 3000);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Chiave normalizzata per confronti/raggruppamenti case-insensitive sul nome
// circuito. NON usare per il valore persistito in entry.circuito (quello
// resta con la grafia originale scritta dall'utente) né per il testo
// mostrato all'utente: per quello si sceglie la grafia dell'entry più
// recente del gruppo (vedi groupEntriesByCircuitKey).
function circuitKey(name) {
  return String(name || '').trim().toLowerCase();
}

// ── Stato applicazione ──────────────────────────────────────────────────
let ATHLETES = [];
let CIRCUIT_TIMES = {};
let GPS_DATA = {};
let sessionList = []; // { athleteId, athleteName, tempoTotale, laps, circuito }
let timerInterval = null;
let timerStart = 0;
let lapMarks = []; // secondi assoluti dall'inizio, per calcolare i parziali
let running = false;
let atletaChart = null;
let crMode = 'individuale'; // 'individuale' | 'gruppo'
let groupLastMark = {}; // athleteId -> ultimo tempo assoluto (s) registrato in modalità Gruppo

function groupLapCountFor(athleteId) {
  // Conta solo le entry di QUESTA sessione (sessionList), non lo storico già salvato:
  // il contatore deve riflettere i giri segnati "adesso", per dare feedback immediato.
  return sessionList.filter(e => String(e.athleteId) === String(athleteId)).length;
}

function groupLastTimeFor(athleteId) {
  const entries = sessionList.filter(e => String(e.athleteId) === String(athleteId));
  if (!entries.length) return null;
  return entries[entries.length - 1].tempoTotale;
}

function renderGroupAthleteList() {
  const list = document.getElementById('cr-group-list');
  const filterText = (document.getElementById('cr-group-search').value || '').trim().toLowerCase();
  const filtered = ATHLETES
    .filter(a => a.name.toLowerCase().includes(filterText))
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name, 'it'));

  if (!filtered.length) {
    list.innerHTML = '<div class="cr-empty">Nessun atleta trovato</div>';
    return;
  }

  list.innerHTML = filtered.map(a => {
    const count = groupLapCountFor(a.id);
    const lastTime = groupLastTimeFor(a.id);
    const meta = count > 0 ? `${count} gir${count === 1 ? 'o' : 'i'} · ultimo ${fmtTime(lastTime)}` : 'nessun giro';
    const rowClasses = ['cr-group-row'];
    if (count > 0) rowClasses.push('has-laps');
    if (!running) rowClasses.push('disabled-row');
    return `
      <div class="${rowClasses.join(' ')}" data-athlete-id="${esc(a.id)}">
        <span class="cr-group-name">${esc(a.name)}</span>
        <span class="cr-group-meta">${esc(meta)}</span>
      </div>
    `;
  }).join('');
}

async function loadData() {
  const res = await fetch('/api/data', { headers: authHeaders(false) });
  if (!res.ok) { toast('Errore nel caricamento dati'); return null; }
  return res.json();
}

async function init() {
  const data = await loadData();
  if (!data) return;
  ATHLETES = data.athletes || [];
  CIRCUIT_TIMES = data.circuitTimes || {};
  GPS_DATA = data.gpsData || {};

  populateAthleteSelect();
  populateCircuitDatalist();
  setupAtletaViewListeners();
  setupSquadraViewListeners();
  setupTabListeners();
  setupModeToggle();
  renderAtletaView();
  renderSquadraView();
}

function populateAthleteSelect() {
  const sel = document.getElementById('cr-atleta');
  sel.innerHTML = '<option value="">Seleziona atleta…</option>' +
    ATHLETES.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
}

// Raggruppa un elenco di entries (stesso circuito, grafie eventualmente
// diverse) per circuitKey e restituisce, per ciascun gruppo, la grafia
// dell'entry più recente (cronologicamente) — criterio "ultima scrittura
// vince" per il testo mostrato all'utente.
function groupEntriesByCircuitKey(entries) {
  const groups = new Map(); // key -> { latestEntry, entries: [] }
  entries.forEach(e => {
    const key = circuitKey(e.circuito);
    if (!key) return;
    let g = groups.get(key);
    if (!g) { g = { latestEntry: e, entries: [] }; groups.set(key, g); }
    g.entries.push(e);
    if (compareEntriesChrono(g.latestEntry, e) < 0) g.latestEntry = e;
  });
  return groups;
}

function populateCircuitDatalist() {
  const allEntries = [];
  Object.values(CIRCUIT_TIMES).forEach(list => {
    (list || []).forEach(e => allEntries.push(e));
  });
  const groups = groupEntriesByCircuitKey(allEntries);
  const displayNames = Array.from(groups.values()).map(g => g.latestEntry.circuito);
  const dl = document.getElementById('cr-circuiti-list');
  dl.innerHTML = displayNames.map(n => `<option value="${esc(n)}"></option>`).join('');
}

// ── Gestione tab Storico ────────────────────────────────────────────────
function setupTabListeners() {
  document.getElementById('cr-tab-atleta').addEventListener('click', () => {
    document.getElementById('cr-tab-atleta').classList.add('active');
    document.getElementById('cr-tab-squadra').classList.remove('active');
    document.getElementById('cr-view-atleta').style.display = '';
    document.getElementById('cr-view-squadra').style.display = 'none';
  });
  document.getElementById('cr-tab-squadra').addEventListener('click', () => {
    document.getElementById('cr-tab-squadra').classList.add('active');
    document.getElementById('cr-tab-atleta').classList.remove('active');
    document.getElementById('cr-view-squadra').style.display = '';
    document.getElementById('cr-view-atleta').style.display = 'none';
    renderSquadraView();
  });
}

// ── Toggle Individuale / Gruppo ──────────────────────────────────────────
function setupModeToggle() {
  document.getElementById('cr-mode-individuale').addEventListener('click', () => setCrMode('individuale'));
  document.getElementById('cr-mode-gruppo').addEventListener('click', () => setCrMode('gruppo'));
  document.getElementById('cr-group-search').addEventListener('input', renderGroupAthleteList);
}

function setCrMode(mode) {
  if (mode === crMode) return;
  if (running) { toast('Ferma il cronometro prima di cambiare modalità'); return; }
  crMode = mode;
  document.getElementById('cr-mode-individuale').classList.toggle('active', mode === 'individuale');
  document.getElementById('cr-mode-gruppo').classList.toggle('active', mode === 'gruppo');
  document.getElementById('cr-panel-individuale').style.display = mode === 'individuale' ? '' : 'none';
  document.getElementById('cr-panel-gruppo').style.display = mode === 'gruppo' ? '' : 'none';
  if (mode === 'gruppo') {
    groupLastMark = {};
    renderGroupAthleteList();
  }
}

// ── Storico: vista Per atleta ────────────────────────────────────────────
function timestampFromId(id) {
  // gli id delle sessioni sono tipo 'ctime_<ms>_<rand>'
  const m = /^ctime_(\d+)_/.exec(id || '');
  return m ? parseInt(m[1], 10) : 0;
}

function compareEntriesChrono(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return timestampFromId(a.id) - timestampFromId(b.id);
}

function athletesWithTimes() {
  return ATHLETES.filter(a => Array.isArray(CIRCUIT_TIMES[a.id]) && CIRCUIT_TIMES[a.id].length);
}

function setupAtletaViewListeners() {
  document.getElementById('cr-storico-atleta').addEventListener('change', () => {
    populateStoricoCircuitSelect();
    renderAtletaViewContent();
  });
  document.getElementById('cr-storico-circuito').addEventListener('change', () => {
    renderAtletaViewContent();
  });
}

function populateStoricoAthleteSelect() {
  const sel = document.getElementById('cr-storico-atleta');
  const prevValue = sel.value;
  const list = athletesWithTimes();
  sel.innerHTML = list.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  if (list.some(a => String(a.id) === String(prevValue))) {
    sel.value = prevValue;
  }
}

function populateStoricoCircuitSelect() {
  const athleteSel = document.getElementById('cr-storico-atleta');
  const circuitSel = document.getElementById('cr-storico-circuito');
  const athleteId = athleteSel.value;
  const entries = CIRCUIT_TIMES[athleteId] || [];
  if (!entries.length) {
    circuitSel.innerHTML = '';
    return;
  }
  // Gruppi di circuiti (case-insensitive) cronometrati da questo atleta,
  // con la grafia da mostrare = quella dell'entry più recente del gruppo.
  const groups = groupEntriesByCircuitKey(entries);
  // value dell'option = circuitKey (stabile), testo = grafia più recente
  let mostRecentKey = null;
  let mostRecentEntry = null;
  groups.forEach((g, key) => {
    if (!mostRecentEntry || compareEntriesChrono(mostRecentEntry, g.latestEntry) < 0) {
      mostRecentEntry = g.latestEntry;
      mostRecentKey = key;
    }
  });
  const optionsHtml = [];
  groups.forEach((g, key) => {
    optionsHtml.push(`<option value="${esc(key)}">${esc(g.latestEntry.circuito)}</option>`);
  });
  circuitSel.innerHTML = optionsHtml.join('');
  circuitSel.value = mostRecentKey;
}

function renderAtletaView() {
  populateStoricoAthleteSelect();
  populateStoricoCircuitSelect();
  renderAtletaViewContent();
}

function renderAtletaViewContent() {
  const content = document.getElementById('cr-storico-atleta-content');
  const athleteId = document.getElementById('cr-storico-atleta').value;
  const circuitoKey = document.getElementById('cr-storico-circuito').value;

  if (atletaChart) {
    atletaChart.destroy();
    atletaChart = null;
  }

  if (!athleteId || !circuitoKey || !Array.isArray(CIRCUIT_TIMES[athleteId]) || !CIRCUIT_TIMES[athleteId].length) {
    content.innerHTML = '<div class="cr-empty">Nessun tempo cronometrato ancora</div>';
    return;
  }

  const entries = CIRCUIT_TIMES[athleteId]
    .filter(e => circuitKey(e.circuito) === circuitoKey)
    .slice()
    .sort(compareEntriesChrono);

  if (!entries.length) {
    content.innerHTML = '<div class="cr-empty">Nessun tempo cronometrato ancora</div>';
    return;
  }

  // Grafia da mostrare in etichetta/grafico: quella dell'entry più recente del gruppo
  const circuito = entries.reduce((best, e) => (!best || compareEntriesChrono(best, e) < 0) ? e : best, null).circuito;

  content.innerHTML = `
    <div style="position:relative; height:220px; margin:14px 0;">
      <canvas id="cr-atleta-chart"></canvas>
    </div>
    <table>
      <thead><tr><th>Data</th><th>Tempo</th><th>Variazione</th></tr></thead>
      <tbody id="cr-atleta-storico-body"></tbody>
    </table>
  `;

  const body = document.getElementById('cr-atleta-storico-body');
  body.innerHTML = entries.map((e, i) => {
    let variazioneHtml = '—';
    if (i > 0) {
      const delta = Math.round((e.tempoTotale - entries[i - 1].tempoTotale) * 100) / 100;
      if (delta < 0) {
        variazioneHtml = `<span class="cr-delta-down">▼ ${delta.toFixed(2)}s</span>`;
      } else if (delta > 0) {
        variazioneHtml = `<span class="cr-delta-up">▲ +${delta.toFixed(2)}s</span>`;
      } else {
        variazioneHtml = '<span>= 0.00s</span>';
      }
    }
    return `
      <tr>
        <td>${esc(e.date)}</td>
        <td class="num">${fmtTime(e.tempoTotale)}</td>
        <td>${variazioneHtml}</td>
      </tr>
    `;
  }).join('');

  const ctx = document.getElementById('cr-atleta-chart').getContext('2d');
  atletaChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: entries.map(e => e.date),
      datasets: [{
        label: circuito,
        data: entries.map(e => e.tempoTotale),
        borderColor: '#4ade80',
        backgroundColor: 'transparent',
        tension: 0.2,
        pointBackgroundColor: '#4ade80',
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          grid: { color: '#1e3a52' },
          ticks: { color: '#94a3b8' }
        },
        y: {
          grid: { color: '#1e3a52' },
          ticks: { color: '#94a3b8' },
          title: { display: true, text: 'Tempo (s)', color: '#94a3b8' }
        }
      }
    }
  });
}

// ── Storico: vista Confronto squadra ─────────────────────────────────────
// Restituisce l'elenco dei gruppi circuito (uno per circuitKey) su tutti
// gli atleti: { key, label } dove label è la grafia più recente del gruppo.
function allCircuitGroups() {
  const allEntries = [];
  ATHLETES.forEach(a => {
    (CIRCUIT_TIMES[a.id] || []).forEach(e => allEntries.push(e));
  });
  const groups = groupEntriesByCircuitKey(allEntries);
  const out = [];
  groups.forEach((g, key) => out.push({ key, label: g.latestEntry.circuito }));
  return out;
}

function allEntriesForCircuit(circuitoKey) {
  const out = [];
  ATHLETES.forEach(a => {
    (CIRCUIT_TIMES[a.id] || []).forEach(e => {
      if (circuitKey(e.circuito) === circuitoKey) out.push(Object.assign({ athleteId: a.id, athleteName: a.name }, e));
    });
  });
  return out;
}

// Confronta due date (stringhe) usando, a parità di data, il timestamp
// della entry più recente di quella data tra le entries fornite.
function distinctDatesForCircuit(circuitoKey) {
  const entries = allEntriesForCircuit(circuitoKey);
  const dates = Array.from(new Set(entries.map(e => e.date)));
  const latestTsForDate = {};
  dates.forEach(d => {
    const forDate = entries.filter(e => e.date === d);
    latestTsForDate[d] = forDate.reduce((best, e) => Math.max(best, timestampFromId(e.id)), 0);
  });
  dates.sort((d1, d2) => {
    if (d1 !== d2) return d1 < d2 ? -1 : 1;
    return latestTsForDate[d1] - latestTsForDate[d2];
  });
  return dates;
}

// Ultima entry (per timestamp) di un atleta per un dato circuito (chiave)+data
function latestEntryForAthleteDate(athleteId, circuitoKey, date) {
  const entries = (CIRCUIT_TIMES[athleteId] || []).filter(e => circuitKey(e.circuito) === circuitoKey && e.date === date);
  if (!entries.length) return null;
  return entries.reduce((best, e) => (!best || timestampFromId(e.id) > timestampFromId(best.id)) ? e : best, null);
}

function setupSquadraViewListeners() {
  document.getElementById('cr-squadra-circuito').addEventListener('change', () => {
    populateSquadraDateSelects();
    renderSquadraViewContent();
  });
  document.getElementById('cr-squadra-data-a').addEventListener('change', () => {
    renderSquadraViewContent();
  });
  document.getElementById('cr-squadra-data-b').addEventListener('change', () => {
    renderSquadraViewContent();
  });
}

function populateSquadraCircuitSelect() {
  const sel = document.getElementById('cr-squadra-circuito');
  const prevValue = sel.value;
  const groups = allCircuitGroups();
  sel.innerHTML = groups.map(g => `<option value="${esc(g.key)}">${esc(g.label)}</option>`).join('');
  if (groups.some(g => g.key === prevValue)) {
    sel.value = prevValue;
  }
}

function populateSquadraDateSelects() {
  const circuito = document.getElementById('cr-squadra-circuito').value;
  const dateASel = document.getElementById('cr-squadra-data-a');
  const dateBSel = document.getElementById('cr-squadra-data-b');
  const dates = circuito ? distinctDatesForCircuit(circuito) : [];

  if (dates.length < 2) {
    dateASel.innerHTML = dates.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
    dateBSel.innerHTML = dateASel.innerHTML;
    return;
  }

  const options = dates.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  dateASel.innerHTML = options;
  dateBSel.innerHTML = options;
  // Default: le due sessioni più recenti (penultima vs ultima)
  dateASel.value = dates[dates.length - 2];
  dateBSel.value = dates[dates.length - 1];
}

function renderSquadraView() {
  populateSquadraCircuitSelect();
  populateSquadraDateSelects();
  renderSquadraViewContent();
}

function renderSquadraViewContent() {
  const content = document.getElementById('cr-squadra-content');
  const circuito = document.getElementById('cr-squadra-circuito').value;
  const dateA = document.getElementById('cr-squadra-data-a').value;
  const dateB = document.getElementById('cr-squadra-data-b').value;

  if (!circuito) {
    content.innerHTML = '<div class="cr-empty">Nessun tempo cronometrato ancora</div>';
    return;
  }

  const dates = distinctDatesForCircuit(circuito);
  if (dates.length < 2) {
    content.innerHTML = '<div class="cr-empty">Servono almeno due sessioni per questo circuito per fare un confronto</div>';
    return;
  }

  if (!dateA || !dateB) {
    content.innerHTML = '<div class="cr-empty">Servono almeno due sessioni per questo circuito per fare un confronto</div>';
    return;
  }

  const rows = [];
  ATHLETES.forEach(a => {
    const entryA = latestEntryForAthleteDate(a.id, circuito, dateA);
    const entryB = latestEntryForAthleteDate(a.id, circuito, dateB);
    if (entryA && entryB) {
      rows.push({ athleteName: a.name, tempoA: entryA.tempoTotale, tempoB: entryB.tempoTotale });
    }
  });

  if (!rows.length) {
    content.innerHTML = '<div class="cr-empty">Nessun atleta ha tempi in entrambe le date selezionate</div>';
    return;
  }

  function variazioneHtml(tempoA, tempoB) {
    const delta = Math.round((tempoB - tempoA) * 100) / 100;
    if (delta < 0) {
      return `<span class="cr-delta-down">▼ ${delta.toFixed(2)}s</span>`;
    } else if (delta > 0) {
      return `<span class="cr-delta-up">▲ +${delta.toFixed(2)}s</span>`;
    }
    return '<span>= 0.00s</span>';
  }

  content.innerHTML = `
    <table>
      <thead><tr><th>Atleta</th><th>Tempo A</th><th>Tempo B</th><th>Variazione</th></tr></thead>
      <tbody id="cr-squadra-body"></tbody>
    </table>
  `;

  const body = document.getElementById('cr-squadra-body');
  const rowsHtml = rows.map(r => `
    <tr>
      <td>${esc(r.athleteName)}</td>
      <td class="num">${fmtTime(r.tempoA)}</td>
      <td class="num">${fmtTime(r.tempoB)}</td>
      <td>${variazioneHtml(r.tempoA, r.tempoB)}</td>
    </tr>
  `).join('');

  const mediaA = Math.round((rows.reduce((sum, r) => sum + r.tempoA, 0) / rows.length) * 100) / 100;
  const mediaB = Math.round((rows.reduce((sum, r) => sum + r.tempoB, 0) / rows.length) * 100) / 100;
  const mediaRowHtml = `
    <tr style="font-weight:600;">
      <td>Media squadra</td>
      <td class="num">${fmtTime(mediaA)}</td>
      <td class="num">${fmtTime(mediaB)}</td>
      <td>${variazioneHtml(mediaA, mediaB)}</td>
    </tr>
  `;

  body.innerHTML = rowsHtml + mediaRowHtml;
}

// ── Cronometro ──────────────────────────────────────────────────────────
function fmtTime(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = Math.floor(totalSec % 60);
  const cs = Math.round((totalSec - Math.floor(totalSec)) * 100);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
}

function updateDisplay() {
  const elapsed = running ? (Date.now() - timerStart) / 1000 : lastElapsed;
  document.getElementById('cr-display').textContent = fmtTime(elapsed);
}

let lastElapsed = 0;

function startTimer() {
  if (running) return;
  if (!document.getElementById('cr-circuito').value.trim()) {
    toast('Inserisci il nome del circuito prima di partire');
    return;
  }
  running = true;
  timerStart = Date.now();
  lapMarks = [];
  document.getElementById('cr-laps').innerHTML = '';
  timerInterval = setInterval(updateDisplay, 30);
  document.getElementById('cr-btn-start').disabled = true;
  document.getElementById('cr-btn-lap').disabled = false;
  document.getElementById('cr-btn-stop').disabled = false;
  document.getElementById('cr-circuito').disabled = true;
  updateResetButtonState();
}

function lapTimer() {
  if (!running) return;
  const elapsed = (Date.now() - timerStart) / 1000;
  const prevMark = lapMarks.length ? lapMarks[lapMarks.length - 1] : 0;
  const lapDuration = elapsed - prevMark;
  lapMarks.push(elapsed);
  const row = document.createElement('div');
  row.className = 'cr-lap-row';
  row.innerHTML = `<span>Lap ${lapMarks.length}</span><span>${fmtTime(lapDuration)}</span>`;
  document.getElementById('cr-laps').appendChild(row);
}

function stopTimer() {
  if (!running) return;
  running = false;
  clearInterval(timerInterval);
  lastElapsed = (Date.now() - timerStart) / 1000;
  updateDisplay();
  document.getElementById('cr-btn-start').disabled = false;
  document.getElementById('cr-btn-lap').disabled = true;
  document.getElementById('cr-btn-stop').disabled = true;
  document.getElementById('cr-atleta').disabled = false;
  document.getElementById('cr-btn-assign').disabled = false;
  updateResetButtonState();
}

function resetTimerKeepCircuit() {
  lastElapsed = 0;
  lapMarks = [];
  document.getElementById('cr-display').textContent = '00:00.00';
  document.getElementById('cr-laps').innerHTML = '';
  document.getElementById('cr-circuito').disabled = false;
  document.getElementById('cr-atleta').value = '';
  document.getElementById('cr-atleta').disabled = true;
  document.getElementById('cr-btn-assign').disabled = true;
}

function updateResetButtonState() {
  const resetBtn = document.getElementById('cr-btn-reset');
  resetBtn.disabled = !running && lastElapsed === 0;
}

function resetTimer() {
  if (!running && lastElapsed === 0) return; // stato "pronto", nulla da azzerare
  if (running) {
    running = false;
    clearInterval(timerInterval);
  }
  lastElapsed = 0;
  lapMarks = [];
  groupLastMark = {};
  document.getElementById('cr-display').textContent = '00:00.00';
  document.getElementById('cr-laps').innerHTML = '';
  document.getElementById('cr-circuito').disabled = false;
  document.getElementById('cr-atleta').value = '';
  document.getElementById('cr-atleta').disabled = true;
  document.getElementById('cr-btn-assign').disabled = true;
  document.getElementById('cr-btn-start').disabled = false;
  document.getElementById('cr-btn-lap').disabled = true;
  document.getElementById('cr-btn-stop').disabled = true;
  updateResetButtonState();
  if (crMode === 'gruppo') renderGroupAthleteList();
  toast('Cronometro azzerato');
}

document.getElementById('cr-btn-start').addEventListener('click', startTimer);
document.getElementById('cr-btn-lap').addEventListener('click', lapTimer);
document.getElementById('cr-btn-stop').addEventListener('click', stopTimer);
document.getElementById('cr-btn-reset').addEventListener('click', resetTimer);

document.getElementById('cr-btn-assign').addEventListener('click', () => {
  const athleteId = document.getElementById('cr-atleta').value;
  if (!athleteId) { toast('Seleziona un atleta'); return; }
  const athlete = ATHLETES.find(a => String(a.id) === String(athleteId));
  if (!athlete) return;
  const circuito = document.getElementById('cr-circuito').value.trim();
  const laps = [];
  let prev = 0;
  lapMarks.forEach(m => { laps.push(Math.round((m - prev) * 100) / 100); prev = m; });

  sessionList.push({
    athleteId: athlete.id,
    athleteName: athlete.name,
    circuito,
    tempoTotale: Math.round(lastElapsed * 100) / 100,
    laps
  });
  renderSessionList();
  resetTimerKeepCircuit();
  toast('Tempo assegnato a ' + athlete.name);
});

// ── Lista sessione ──────────────────────────────────────────────────────
// Testo leggibile dei lap di una entry sessione, per il tooltip title della
// cella tempo. Restituisce '' se non ci sono lap (nessun title da mostrare).
function lapsTooltipText(entry) {
  if (!entry || !Array.isArray(entry.laps) || !entry.laps.length) return '';
  return entry.laps.map((lap, i) => `Lap ${i + 1}: ${fmtTime(lap)}`).join('\n');
}

function renderSessionList() {
  const card = document.getElementById('cr-session-card');
  const body = document.getElementById('cr-session-body');
  if (!sessionList.length) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  body.innerHTML = sessionList.map((e, i) => {
    const lapsText = lapsTooltipText(e);
    const titleAttr = lapsText ? ` title="${esc(lapsText)}"` : '';
    return `
    <tr>
      <td>${esc(e.athleteName)}</td>
      <td class="num"${titleAttr}>${fmtTime(e.tempoTotale)}</td>
      <td>
        <button class="cr-icon-btn" data-action="edit" data-idx="${i}" title="Modifica">✏️</button>
        <button class="cr-icon-btn" data-action="del" data-idx="${i}" title="Rimuovi">🗑️</button>
      </td>
    </tr>
  `;
  }).join('');
  document.getElementById('cr-btn-save').textContent = `💾 Salva tutti i tempi (${sessionList.length})`;
}

document.getElementById('cr-session-body').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-action]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if (btn.dataset.action === 'del') {
    sessionList.splice(idx, 1);
    renderSessionList();
  } else if (btn.dataset.action === 'edit') {
    const entry = sessionList[idx];
    const nuovo = prompt('Nuovo tempo totale in secondi (es. 8.42) per ' + entry.athleteName, entry.tempoTotale);
    if (nuovo === null) return;
    const val = parseFloat(nuovo.replace(',', '.'));
    if (isNaN(val) || val <= 0) { toast('Valore non valido'); return; }
    entry.tempoTotale = Math.round(val * 100) / 100;
    renderSessionList();
  }
});

document.getElementById('cr-btn-save').addEventListener('click', saveSession);

// ── Salvataggio (rileggi prima di scrivere) ──────────────────────────────
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function makeCircuitTimeId() {
  return 'ctime_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
}

async function saveSession() {
  if (!sessionList.length) return;
  const btn = document.getElementById('cr-btn-save');
  btn.disabled = true;
  btn.textContent = 'Salvataggio…';

  try {
    // 1. Rilettura fresca dello stato corrente (evita di sovrascrivere modifiche concorrenti)
    const fresh = await loadData();
    if (!fresh) throw new Error('reload-failed');
    const freshCircuitTimes = fresh.circuitTimes || {};
    const freshGpsData = fresh.gpsData || {};
    const today = todayStr();

    // 2. Merge additivo di circuitTimes
    sessionList.forEach(entry => {
      const athleteId = String(entry.athleteId);
      if (!freshCircuitTimes[athleteId]) freshCircuitTimes[athleteId] = [];
      freshCircuitTimes[athleteId].push({
        id: makeCircuitTimeId(),
        date: today,
        circuito: entry.circuito,
        tempoTotale: entry.tempoTotale,
        laps: entry.laps,
        createdBy: ss('gosport_auth_user') || ''
      });
    });

    // 3. Collegamento con Dati Performance (gpsData): aggiorna/crea la sessione odierna,
    //    sempre indice [0] dell'array, mai indovinare quale sessione tra più di una.
    sessionList.forEach(entry => {
      const athleteId = String(entry.athleteId);
      if (!freshGpsData[athleteId]) freshGpsData[athleteId] = {};
      if (!freshGpsData[athleteId][today] || !Array.isArray(freshGpsData[athleteId][today]) || !freshGpsData[athleteId][today].length) {
        freshGpsData[athleteId][today] = [{
          tempo_circuito_totale_s: entry.tempoTotale,
          distanza_circuito: null,
          velocita_circuito: null,
          fonte: 'cronografo'
        }];
      } else {
        const session0 = freshGpsData[athleteId][today][0];
        session0.tempo_circuito_totale_s = entry.tempoTotale;
        if (session0.distanza_circuito) {
          session0.velocita_circuito = parseFloat(((session0.distanza_circuito / entry.tempoTotale) * 3.6).toFixed(2));
        }
      }
    });

    // 4. POST del merge
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify({ circuitTimes: freshCircuitTimes, gpsData: freshGpsData })
    });
    if (!res.ok) throw new Error('save-failed');

    // 5. Successo: aggiorna stato locale, svuota lista, ricarica storico
    CIRCUIT_TIMES = freshCircuitTimes;
    GPS_DATA = freshGpsData;
    sessionList = [];
    renderSessionList();
    populateCircuitDatalist();
    renderAtletaView();
    renderSquadraView();
    toast('Tempi salvati con successo');
  } catch (err) {
    // Errore di rete: la lista sessione resta intatta, l'utente può ritentare
    toast('Errore di salvataggio — riprova, la lista è stata mantenuta');
    btn.disabled = false;
    btn.textContent = `💾 Salva tutti i tempi (${sessionList.length})`;
  }
}

init();
